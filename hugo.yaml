baseURL: "https://jpbar.github.io/nijebarzh/"
languageCode: "fr-FR"
defaultContentLanguage: "fr"
title: "Nij e Barzh"
description: "Club de modélisme indoor de Plouvien — aéromodélisme en salle, F3P"
theme: "blowfish"
mainSections: ["posts"]

pagination:
  pagerSize: 8

module:
  mounts:
    - source: content
      target: content
    - source: layouts
      target: layouts
    - source: static
      target: static
    - source: data
      target: data
    - source: assets
      target: assets
    - source: i18n
      target: i18n
    - source: archetypes
      target: archetypes
    - source: static/images/modeles-du-club
      target: assets/modeles-du-club

params:
  logo: "images/logo.png"
  colorScheme: "avocado"
  header:
    layout: "fixed-fill"
  list:
    showCards: true
    showSummary: false
  homepage:
    layout: "landing"
    showRecent: true
    showRecentItems: 3
    showMoreLink: true
    showMoreLinkDest: "/posts/"
  article:
    showReadingTime: false
    showDate: false
    showDateOnlyInArticle: true
  footer:
    showCopyright: true
    showThemeAttribution: false

menus:
  main:
    - name: "Le Club"
      pageRef: "le-club"
      weight: 10
    - name: "Compétition F3P"
      pageRef: "f3p"
      weight: 20
    - name: "Avions Indoor"
      pageRef: "avions-indoor"
      weight: 30
    - name: "Documentation"
      pageRef: "docs"
      weight: 40
    - name: "Galerie"
      pageRef: "galerie"
      weight: 50
