{{ $imgs := len (findRE "<img" .Content) }}
{{ $videos := len (findRE "youtube" .Content) }}
{{ $docs := len (findRE ".pdf|.dxf" .Content) }}
{{ if or $imgs $videos $docs }}
<div class="not-prose flex flex-wrap gap-3 text-xs text-neutral-500 dark:text-neutral-400 mt-1">
  {{ if $imgs }}<span>📷 {{ $imgs }}</span>{{ end }}
  {{ if $videos }}<span>🎬 {{ $videos }}</span>{{ end }}
  {{ if $docs }}<span>📄 {{ $docs }}</span>{{ end }}
</div>
{{ end }}
